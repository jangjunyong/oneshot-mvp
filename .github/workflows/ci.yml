name: CI

# 에이전트의 눈. 타입·린트·빌드가 통과해야 머지한다.
# 배포는 여기서 하지 않는다 — Vercel Git 연동이 push 를 보고 자동 배포한다.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 린트
        run: npm run lint

      - name: 빌드
        run: npm run build
        env:
          # 빌드 시점에는 실제 키가 필요 없다. 런타임에만 쓴다.
          DART_API_KEY: dummy-for-build
